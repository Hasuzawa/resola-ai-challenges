---
version: '3'

services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      - POSTGRES_DB=develop
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=dev
    ports:
      - 5432:5432
    volume:
      - type: bind
        source: ./database/script
        target: /docker-entrypoint-initdb.d
    restart: unless-stopped
